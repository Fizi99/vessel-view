services:
  vessel-view:
    build:
      target: production
      context: .
      dockerfile: Dockerfile.prod
    container_name: vessel-view-prod
    ports:
      - 8080:8080
    environment:
      DATABASE_URL: ${DB_URL}
    depends_on:
      db-prod:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  db-prod:
    image: postgres:19
    restart: always
    volumes:
      - prod_db_data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build:
      target: migrate
      context: .
      dockerfile: Dockerfile.prod
    command: ["goose", "up"]
    environment:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: ${DB_URL}
      GOOSE_MIGRATION_DIR: /migrations
    depends_on:
      db-prod:
        condition: service_healthy
  pgadmin4:
    image: dpage/pgadmin4
    restart: always
    ports:
      - 80:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  prod_db_data: